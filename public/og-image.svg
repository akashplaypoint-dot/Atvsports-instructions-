<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070709"/>
      <stop offset="50%" stop-color="#12111a"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <radialGradient id="glow" cx="25%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#E50914" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Subtle grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Brand Badge -->
  <g transform="translate(100, 100)">
    <rect width="170" height="42" rx="21" fill="#E50914" fill-opacity="0.15" stroke="#E50914" stroke-width="1.5" stroke-opacity="0.4"/>
    <circle cx="24" cy="21" r="5" fill="#E50914"/>
    <text x="38" y="26" fill="#FF5555" font-family="'Chakra Petch', 'Segoe UI', sans-serif" font-size="14" font-weight="700" letter-spacing="2">OFFICIAL APP</text>
  </g>

  <!-- Big Headline -->
  <text x="100" y="230" fill="#FFFFFF" font-family="'Chakra Petch', 'Arial Black', sans-serif" font-size="76" font-weight="900" letter-spacing="2">ATV <tspan fill="#E50914">SPORTS</tspan></text>
  <text x="100" y="310" fill="#E4E4E7" font-family="'Chakra Petch', sans-serif" font-size="34" font-weight="700">Live Sports, Football, Cricket &amp; TV Channels</text>
  <text x="100" y="360" fill="#A1A1AA" font-family="sans-serif" font-size="20" font-weight="400">Official Android APK Download, Match Guides &amp; Multi-Server Streaming</text>

  <!-- Feature Pills -->
  <g transform="translate(100, 420)">
    <rect x="0" y="0" width="190" height="46" rx="10" fill="#181824" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="24" y="28" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="600">⚽ Live Football</text>

    <rect x="210" y="0" width="180" height="46" rx="10" fill="#181824" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="234" y="28" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="600">🏏 Live Cricket</text>

    <rect x="410" y="0" width="190" height="46" rx="10" fill="#181824" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="434" y="28" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="600">📺 Sports TV</text>

    <rect x="620" y="0" width="220" height="46" rx="10" fill="#181824" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="644" y="28" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="600">⚡ Android 5.0+ APK</text>
  </g>

  <!-- URL Tagline -->
  <g transform="translate(100, 530)">
    <text x="0" y="0" fill="#E50914" font-family="'Chakra Petch', monospace" font-size="18" font-weight="700" letter-spacing="1">https://atvsports.com</text>
    <text x="260" y="0" fill="#71717A" font-family="sans-serif" font-size="16">• Fast, Lightweight &amp; Verified Official Source</text>
  </g>
</svg>
