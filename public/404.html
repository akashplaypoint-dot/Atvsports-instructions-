<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ATV Sports – Redirecting...</title>
    <script>
      // Single Page Application redirect handler for static hosts (GitHub Pages, etc.)
      sessionStorage.redirect = location.href;
      var l = window.location;
      var path = l.pathname.slice(1);
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/?/' + path.replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #070709;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .loader {
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="loader">
      <p>Loading ATV Sports...</p>
    </div>
  </body>
</html>
